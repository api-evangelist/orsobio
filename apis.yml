aid: orsobio
name: OrsoBio
image: https://orsobio.com/wp-content/uploads/2022/10/orso-bio.png
description: >-
  OrsoBio is a privately held, clinical-stage biopharmaceutical company founded in 2021 and
  headquartered in Palo Alto, California, developing first-in-class oral therapies that restore
  energy homeostasis in patients living with severe metabolic disorders — obesity, type 2 diabetes,
  severe dyslipidemias, lipodystrophies and MASH. The name is drawn from the metabolic adaptability
  of bears ("orso" in Italian). Its pipeline is led by three mitochondrial protonophores — TLC-6740,
  TLC-1180 and TLC-1235 — intended to increase energy expenditure and improve metabolic and
  cardiovascular health, alongside an LXR inverse agonist (TLC-2716) for severe hypertriglyceridemia
  and MASH, an ACC2 inhibitor (TLC-3595) for insulin sensitivity in type 2 diabetes, and an ACMSD
  inhibitor to augment NAD+ biosynthesis in metabolic and inflammatory liver and kidney disorders.
  The company closed an oversubscribed $67 million Series B in September 2024, co-led by Ascenta
  Capital and Woodline Partners with participation from Samsara BioCapital, Enavate Sciences and
  Longitude Capital. OrsoBio publishes a corporate site covering its science, pipeline, team, board,
  publications, events and press releases, but runs no developer program: no API documentation, no
  SDKs, no developer portal, no GitHub organisation and no machine-readable API contract of any
  kind. The only machine-readable surface on orsobio.com is the site's own WordPress CMS route
  index, which the site's robots.txt explicitly disallows at /wp-json/ and which is therefore not
  harvested or catalogued here.
